<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My runs</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="stats.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --bg: #0b0d10; --panel: rgba(16,19,24,.88); --text: #e8eaed; --muted: #8b939e;
    --line: #2a3038; --accent: #ff6a2b; --chip: #1a1f26;
    --panel-border: rgba(255,255,255,.16);
    /* thick multi-layer shadow: crisp contact + wide, soft halo */
    --shadow: 0 2px 4px rgba(0,0,0,.35), 0 12px 24px rgba(0,0,0,.45), 0 30px 70px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; top: 16px; left: 16px; width: 340px; padding: 18px;
    background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--panel-border);
    border-radius: 12px; z-index: 2; max-height: calc(100% - 32px); overflow: auto; box-shadow: var(--shadow); }
  h1, .settings h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; letter-spacing: .02em;
    display: flex; align-items: center; justify-content: space-between; }
  .h-actions { display: flex; gap: 4px; }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
    background: none; border: 0; border-radius: 6px; color: var(--muted); cursor: pointer; font: inherit; }
  .icon-btn:hover, .icon-btn.on { background: var(--chip); color: var(--text); }
  .settings { position: absolute; top: 16px; left: 372px; width: 320px; padding: 18px; z-index: 3;
    background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--panel-border);
    border-radius: 12px; box-shadow: var(--shadow); }
  .settings[hidden] { display: none; }
  .settings > .label:first-of-type { margin-top: 0; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }
  .stat b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .label { color: var(--muted); font-size: 12px; margin: 14px 0 6px; display: flex; justify-content: space-between; }
  .seg { display: flex; background: var(--chip); border-radius: 8px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: none; color: var(--muted); padding: 6px 4px; border-radius: 6px;
    cursor: pointer; font: inherit; }
  .seg button.on { background: var(--accent); color: #111; font-weight: 600; }
  .layers { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  /* Toggle buttons: the checkbox is hidden, the label acts as the button */
  .layers label, .src label { position: relative; display: flex; align-items: center; justify-content: center;
    padding: 8px 10px; cursor: pointer; background: var(--chip); color: var(--muted);
    border-radius: 8px; user-select: none; transition: background .15s, color .15s; }
  .layers label:hover, .src label:hover { color: var(--text); }
  .layers label:has(input:checked), .src label:has(input:checked) {
    background: var(--accent); color: #111; font-weight: 600; }
  .layers label:has(input:focus-visible), .src label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .layers input, .src input { position: absolute; opacity: 0; pointer-events: none; }
  .colors { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .colors label { display: flex; align-items: center; gap: 8px; padding: 5px 8px; background: var(--chip);
    border-radius: 8px; cursor: pointer; }
  .colors input { width: 26px; height: 22px; padding: 0; border: 0; background: none; cursor: pointer; }
  .colors input::-webkit-color-swatch-wrapper { padding: 0; }
  .colors input::-webkit-color-swatch { border: 1px solid var(--line); border-radius: 5px; }
  .link { background: none; border: 0; padding: 0; color: var(--muted); font: inherit; cursor: pointer; text-decoration: underline; }
  .link:hover { color: var(--text); }
  .range { position: relative; height: 24px; }
  .range input { position: absolute; left: 0; right: 0; width: 100%; margin: 0; pointer-events: none;
    -webkit-appearance: none; appearance: none; background: none; top: 6px; }
  .range input::-webkit-slider-thumb { pointer-events: auto; -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--accent); border: 2px solid #111; cursor: pointer; }
  .range input::-moz-range-thumb { pointer-events: auto; width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); border: 2px solid #111; cursor: pointer; }
  .slider { width: 100%; margin: 0; accent-color: var(--accent); }
  #heatCtl.off, #lineCtl.off { opacity: .35; pointer-events: none; }
  .track { position: absolute; left: 0; right: 0; top: 11px; height: 3px; background: #2a3038; border-radius: 2px; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 34px; margin-top: 4px; }
  .bars { cursor: pointer; }
  .bars-wrap { position: relative; }
  .bar-labels { display: flex; gap: 2px; margin-top: 3px; }
  .bar-labels span { flex: 1; text-align: center; font-size: 10px; color: var(--muted);
    font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .bar-labels span.on { color: var(--text); font-weight: 600; }
  .bar-labels span.hover { color: var(--accent); }
  .bar-tip { position: absolute; bottom: calc(100% + 6px); transform: translateX(-50%); z-index: 4;
    padding: 5px 8px; border-radius: 6px; background: #000; color: #fff; font-size: 12px;
    white-space: nowrap; pointer-events: none; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
  .bar-tip b { font-weight: 600; }
  .bar-tip[hidden] { display: none; }
  /* Each column is full height (hover/click area), the colored bar sits inside */
  .bars div { flex: 1; height: 100%; display: flex; align-items: flex-end; border-radius: 3px; }
  .bars div:hover { background: rgba(255,255,255,.06); }
  .bars .fill { width: 100%; background: var(--accent); opacity: .85; border-radius: 2px 2px 0 0; min-height: 1px; }
  .bars div:hover .fill { opacity: 1; filter: brightness(1.25); }
  .bars div.off .fill { opacity: .18; }
  .zfilter { width: 100%; margin: 0 0 6px; padding: 7px 10px; background: var(--chip); color: var(--text);
    border: 1px solid transparent; border-radius: 8px; font: inherit; outline: none; }
  .zfilter::placeholder { color: var(--muted); }
  .zfilter:focus { border-color: var(--accent); }
  .zempty { color: var(--muted); font-size: 12px; padding: 8px 0; text-align: center; }
  .zempty[hidden], .zones button[hidden] { display: none; }
  .zones { max-height: 240px; overflow-y: auto; margin: 0 -6px; }
  .zones button { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 6px;
    width: 100%; padding: 6px; background: none; border: 0; border-radius: 6px; color: var(--text);
    font: inherit; text-align: left; cursor: pointer; }
  .zones button:hover, .zones button.on { background: var(--chip); }
  .zones button.on .zn { color: var(--accent); }
  .zones .zn { min-width: 0; }
  .zones .zname, .zones .zvia { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .zones .zvia { color: var(--muted); font-size: 12px; }
  /* Constant height; without a subtitle, the name is vertically centered */
  .zones button { min-height: 48px; }
  .zones .zvia:empty { display: none; }
  .zones small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .zones button.dim { opacity: .35; }
  .src { display: flex; gap: 6px; }
  .src label { flex: 1; }
  .btn { width: 100%; margin-top: 14px; padding: 8px; background: var(--chip); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font: inherit; }
  .btn:hover { border-color: var(--accent); }
  #toggle { display: none; }
  .colors label { color: var(--text); white-space: nowrap; }
  .goal { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .goal input { width: 90px; padding: 6px 8px; background: var(--chip); color: var(--text); border: 1px solid transparent;
    border-radius: 8px; font: inherit; outline: none; }
  .goal input:focus { border-color: var(--accent); }
  @media (max-width: 600px) {
    .panel { left: 16px; right: 16px; width: auto; top: auto; bottom: 16px; max-height: 60%; }
    .panel.collapsed > :not(h1) { display: none; }
    #toggle { display: inline-flex; }
    .settings { left: 16px; right: 16px; width: auto; top: 16px; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel" id="panel">
  <h1><span>My runs</span>
    <span class="h-actions">
      <button class="icon-btn" id="openStats" title="Statistics" aria-label="Statistics">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 3v18h18"/><path d="M7 15l4-5 4 3 5-7"/>
        </svg>
      </button>
      <button class="icon-btn" id="openSettings" title="Display settings" aria-label="Display settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button class="icon-btn" id="toggle" aria-label="Collapse panel">▾</button>
    </span>
  </h1>
  <div class="stats">
    <div class="stat"><b id="sRuns">–</b><span>runs</span></div>
    <div class="stat"><b id="sKm">–</b><span>km</span></div>
  </div>

  <div class="label"><span>Basemap</span></div>
  <div class="seg" id="base">
    <button data-base="dark">Dark</button>
    <button data-base="standard">Streets</button>
    <button data-base="topo">Terrain</button>
    <button data-base="satellite">Satellite</button>
  </div>

  <div class="label"><span>Layers</span></div>
  <div class="layers">
    <label title="Every route you've run, drawn the same — spot every path you've already taken">
      <input type="checkbox" id="showPlain">Routes</label>
    <label title="Brighter where you run more often"><input type="checkbox" id="showLines">Density</label>
    <label title="Where you run most, as a heat gradient"><input type="checkbox" id="showHeat">Heatmap</label>
    <label title="Wide, soft view of your favourite areas"><input type="checkbox" id="showSoft">Hotspots</label>
    <label title="Paths run for the first time in the selected period">
      <input type="checkbox" id="showExplore">New paths</label>
  </div>

  <div class="label"><span>Years</span><span id="yLabel"></span></div>
  <div class="bars-wrap">
    <div class="bars" id="bars"></div>
    <div class="bar-labels" id="barLabels"></div>
    <div class="bar-tip" id="barTip" hidden></div>
  </div>
  <div class="range">
    <div class="track"></div>
    <input type="range" id="yMin"><input type="range" id="yMax">
  </div>
  <div class="label"><span>Places</span><span id="zCount"></span></div>
  <input type="search" class="zfilter" id="zFilter" placeholder="Filter places…" autocomplete="off"
    aria-label="Filter places">
  <div class="zones" id="zones"></div>
  <div class="zempty" id="zEmpty" hidden>No matching place</div>
  <div class="label"><span>Sources</span></div>
  <div class="src" id="src"></div>
  <button class="btn" id="fitMain">Back to my main area</button>
</div>

<!-- Settings popup: non-modal, the map stays visible and updates live -->
<div class="settings" id="settings" role="dialog" aria-label="Display settings" hidden>
  <h2><span>Settings</span><button class="icon-btn" id="closeSettings" aria-label="Close">✕</button></h2>

  <div class="label"><span>Colour scale</span></div>
  <div class="seg" id="scale">
    <button data-scale="global" title="Same scale everywhere: compare places with each other">Global</button>
    <button data-scale="zone" title="Each place gets its own scale: its most-run path hits the top">Per place</button>
  </div>

  <div id="lineCtl">
    <div class="label"><span>Line width</span><span id="lineVal"></span></div>
    <input type="range" id="lineW" min="0" max="100" step="1" class="slider">
  </div>

  <div id="heatCtl">
    <div class="label"><span>Heat intensity</span><span id="heatVal"></span></div>
    <input type="range" id="heatK" min="0" max="100" step="1" class="slider">
  </div>

  <div class="label"><span>Colours</span>
    <button class="link" id="colReset" title="Back to the basemap's default colours">Reset</button></div>
  <div class="colors">
    <label><input type="color" id="colPlain">Routes</label>
    <label><input type="color" id="colLines">Density</label>
    <label><input type="color" id="colExplore">New paths</label>
  </div>

  <div class="label"><span>Yearly goal</span></div>
  <label class="goal"><input type="number" id="goal" min="50" max="10000" step="50"> km / year</label>
</div>

<!-- Stats drawer -->
<section class="stats-drawer" id="statsDrawer" aria-label="Statistics" hidden>
  <header>
    <h2>Statistics</h2>
    <span class="ctx" id="statsCtx"></span>
    <button class="icon-btn" id="closeStats" aria-label="Close statistics">✕</button>
  </header>
  <div class="stats-grid">
    <div class="col col-main">
      <article class="card card-volume">
        <div class="card-h"><h3 id="volTitle">Volume</h3><span class="hint" id="volHint"></span></div>
        <nav class="crumbs" id="volCrumbs" aria-label="Chart level"></nav>
        <div class="chart" id="chVolume"></div>
      </article>
      <article class="card card-cal">
        <div class="card-h"><h3>Calendar</h3><span class="hint">Click a day: its route on the map, its month in the stats</span>
          <span class="cal-nav"><button class="icon-btn" id="calPrev" aria-label="Previous year">‹</button>
          <b id="calYear"></b><button class="icon-btn" id="calNext" aria-label="Next year">›</button></span></div>
        <div class="chart" id="chCal"></div>
      </article>
    </div>
    <div class="col col-side">
      <article class="card card-gauges">
        <div class="card-h"><h3>Goals</h3></div>
        <div class="gauges" id="chGauges"></div>
      </article>
      <article class="card card-records">
        <div class="card-h"><h3>Records</h3></div>
        <ul class="records" id="chRecords"></ul>
      </article>
    </div>
  </div>
</section>
<div class="chart-tip" id="chartTip" hidden></div>

<script>
// ---------- Basemaps ----------
const LOCALE = 'en-GB';           // dates "3 Aug 2022", numbers "1,346"
const EXPLORE_COLOR = '#5ef2c2';  // default: mint green, stands out from the orange tracks on every basemap
const SAT_ATTR = 'Imagery © Esri, Maxar, Earthstar Geographics';
function rasterStyle(url, attribution, maxzoom) {
  return { version: 8,
    sources: { base: { type: 'raster', tileSize: 256, maxzoom, attribution, tiles: [url] } },
    layers: [{ id: 'base', type: 'raster', source: 'base' }] };
}
const BASES = {
  dark: {
    style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    line: '#ffb38a', glow: '#ff6a2b', lineOpacity: [.06, .12, .3], glowOpacity: [.02, .03], plain: '#4fd1ff',
  },
  // Classic OSM map ("OSM Carto" style, the most colorful). Personal use only:
  // the tile.openstreetmap.org policy forbids heavy/public use.
  standard: {
    style: rasterStyle('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', 19),
    line: '#e2470b', glow: '#ff6a2b', lineOpacity: [.1, .2, .45], glowOpacity: [0, 0], plain: '#0a5cff',
  },
  // Terrain: contour lines + hillshading, handy for trail running
  topo: {
    style: rasterStyle('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
      'Tiles © Esri — Esri, HERE, Garmin, USGS, OpenStreetMap', 19),
    line: '#e2470b', glow: '#ff6a2b', lineOpacity: [.1, .2, .45], glowOpacity: [0, 0], plain: '#0a5cff',
  },
  satellite: {
    style: {
      version: 8,
      glyphs: 'https://basemaps.cartocdn.com/fonts/{fontstack}/{range}.pbf',
      sources: {
        sat: { type: 'raster', tileSize: 256, maxzoom: 19, attribution: SAT_ATTR,
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'] },
        labels: { type: 'raster', tileSize: 256, maxzoom: 19,
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'] },
      },
      layers: [
        { id: 'sat', type: 'raster', source: 'sat' },
        { id: 'sat-labels', type: 'raster', source: 'labels', paint: { 'raster-opacity': .85 } },
      ],
    },
    line: '#ffd2b8', glow: '#ff6a2b', lineOpacity: [.12, .22, .45], glowOpacity: [.04, .06], plain: '#00e5ff',
    before: 'sat-labels',
  },
};

// "Classic" heatmap: green (rarely) → yellow → orange → red (often)
const HEAT_COLORS = ['interpolate', ['linear'], ['heatmap-density'],
  0, 'rgba(0,0,0,0)',
  .05, 'rgba(0,200,60,.6)',
  .2, '#00c83c',
  .4, '#8cff00',
  .55, '#ffee00',
  .7, '#ff9000',
  .85, '#ff2a00',
  1, '#d00000'];

// "Diffuse" eye-tracking-style heatmap: large radius, halo blue → cyan → green → yellow → red
const SOFT_COLORS = ['interpolate', ['linear'], ['heatmap-density'],
  0, 'rgba(0,0,0,0)',
  .03, 'rgba(40,40,255,.4)',
  .15, 'rgba(20,60,255,.75)',
  .3, 'rgba(0,220,255,.85)',
  .5, 'rgba(40,255,0,.9)',
  .7, 'rgba(255,240,0,.92)',
  .85, 'rgba(255,120,0,.95)',
  1, 'rgba(255,0,0,.95)'];
const softIntensity = () => {
  const k = heatMult(state.heatK);
  return ['interpolate', ['linear'], ['zoom'], 8, .15 * k, 15, .5 * k];
};

// ---------- State (saved in the browser) ----------
// Track width: slider 0–100 → ×0.25 to ×4 (50 = ×1)
const lineMult = v => Math.pow(2, (v - 50) / 25);
const lineWidth = () => {
  const k = lineMult(state.lineW);
  return ['interpolate', ['linear'], ['zoom'], 8, .5 * k, 14, 1.6 * k, 18, 3 * k];
};
const glowWidth = () => {
  const k = lineMult(state.lineW);
  return ['interpolate', ['linear'], ['zoom'], 8, 2 * k, 14, 8 * k];
};

// colLines / colPlain: user-chosen color (null = basemap's default color)
const state = { base: 'dark', lines: true, heat: false, soft: false, plain: false, explore: false, heatK: 50, lineW: 50, scale: 'global',
  colLines: null, colPlain: null, colExplore: null, goal: 1000, stats: false,
  yMin: 0, yMax: 9999, dFrom: null, dTo: null, zone: null, sources: new Set() };
const lineColor = () => state.colLines || BASES[state.base].line;
const glowColor = () => state.colLines || BASES[state.base].glow;
const plainColor = () => state.colPlain || BASES[state.base].plain;
const exploreColor = () => state.colExplore || EXPLORE_COLOR;
// slider 0–100 → intensity multiplier ×0.18 to ×5.7 (logarithmic scale, 50 = ×1)
const heatMult = v => Math.pow(2, (v - 50) / 20);
const heatIntensity = () => {
  const k = heatMult(state.heatK);
  return ['interpolate', ['linear'], ['zoom'], 8, .3 * k, 15, 1.2 * k];
};
try { Object.assign(state, JSON.parse(localStorage.getItem('runmap') || '{}')); } catch (e) {}
state.sources = new Set();
if (!BASES[state.base]) state.base = 'dark';
const save = () => {
  try { localStorage.setItem('runmap', JSON.stringify(
    { base: state.base, lines: state.lines, heat: state.heat, soft: state.soft, plain: state.plain, explore: state.explore, heatK: state.heatK, lineW: state.lineW, scale: state.scale,
      colLines: state.colLines, colPlain: state.colPlain, colExplore: state.colExplore,
      goal: state.goal, stats: state.stats })); } catch (e) {}
};

const map = new maplibregl.Map({
  container: 'map', style: BASES[state.base].style,
  center: [2.35, 48.85], zoom: 4, attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-right');

let runs, linesGeo, pointsGeo, exploreGeo, zone, bars;
let yearAnchor = null;  // last clicked year, anchor for shift + click

// Densest area (~5 km grid) for the initial view
function mainZone(runs) {
  const cells = new Map();
  for (const r of runs) {
    const [lon, lat] = r.segs[0][0];
    const k = Math.round(lon / .05) + ',' + Math.round(lat / .05);
    const c = cells.get(k) || { n: 0, pts: [] };
    c.n++; c.pts.push([lon, lat]); cells.set(k, c);
  }
  const best = [...cells.values()].sort((a, b) => b.n - a.n)[0];
  const ids = new Set(best.pts.map(p => p.join()));
  const xs = [], ys = [];
  for (const r of runs) if (ids.has(r.segs[0][0].join()))
    for (const s of r.segs) for (const [x, y] of s) { xs.push(x); ys.push(y); }
  xs.sort((a, b) => a - b); ys.sort((a, b) => a - b);
  const q = (arr, p) => arr[Math.floor(p * (arr.length - 1))];
  // 2–98% percentiles: ignores the few outlier tracks
  return new maplibregl.LngLatBounds([q(xs, .02), q(ys, .02)], [q(xs, .98), q(ys, .98)]);
}

// (Re)creates sources + layers: called on load and on every basemap change
function addOverlay() {
  if (map.getSource('runs')) return;
  const b = BASES[state.base];
  const before = b.before || map.getStyle().layers.find(l => l.type === 'symbol')?.id;
  map.addSource('runs', { type: 'geojson', data: linesGeo });
  map.addSource('pts', { type: 'geojson', data: pointsGeo });

  // Order: diffuse at the bottom, sharp heatmap, then tracks on top — all stack up
  map.addLayer({ id: 'soft', type: 'heatmap', source: 'pts',
    paint: {
      'heatmap-weight': weight(.008),
      'heatmap-intensity': softIntensity(),
      'heatmap-radius': ['interpolate', ['exponential', 1.6], ['zoom'], 6, 12, 10, 25, 13, 45, 16, 90, 18, 140],
      'heatmap-opacity': .9,
      'heatmap-color': SOFT_COLORS,
    } }, before);
  map.addLayer({ id: 'heat', type: 'heatmap', source: 'pts',
    paint: {
      'heatmap-weight': weight(.06),
      'heatmap-intensity': heatIntensity(),
      'heatmap-radius': ['interpolate', ['linear'], ['zoom'], 8, 3, 13, 10, 16, 22],
      'heatmap-opacity': .85,
      'heatmap-color': HEAT_COLORS,
    } }, before);
  map.addLayer({ id: 'glow', type: 'line', source: 'runs',
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': glowColor(), 'line-blur': 4,
      'line-width': glowWidth(),
      'line-opacity': glowOpacity() } }, before);
  map.addLayer({ id: 'lines', type: 'line', source: 'runs',
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': lineColor(),
      'line-width': lineWidth(),
      'line-opacity': lineOpacity() } }, before);
  // Plain tracks: uniform opaque line, a path run once = a path run 300 times
  map.addLayer({ id: 'plain', type: 'line', source: 'runs',
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': plainColor(), 'line-width': lineWidth(), 'line-opacity': .95 } }, before);
  map.addSource('explore', { type: 'geojson', data: exploreGeo });
  map.addLayer({ id: 'ex-glow', type: 'line', source: 'explore', layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': exploreColor(), 'line-blur': 5, 'line-opacity': .25,
      'line-width': ['interpolate', ['linear'], ['zoom'], 8, 3, 14, 10] } }, before);
  // Dark casing under the dashes: the gaps stay dark even over the Routes layer
  map.addLayer({ id: 'ex-case', type: 'line', source: 'explore', layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': '#0b0d10', 'line-opacity': .85,
      'line-width': ['interpolate', ['linear'], ['zoom'], 8, 2.5, 14, 5, 18, 7] } }, before);
  // Dashed line: butt caps keep the dashes crisp (round caps would merge them)
  map.addLayer({ id: 'ex', type: 'line', source: 'explore', layout: { 'line-join': 'round', 'line-cap': 'butt' },
    paint: { 'line-color': exploreColor(), 'line-dasharray': [2, 1.5],
      'line-width': ['interpolate', ['linear'], ['zoom'], 8, 1, 14, 2.5, 18, 4] } }, before);
  map.addSource('hl', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'hl-glow', type: 'line', source: 'hl', layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': '#ffd86f', 'line-width': 12, 'line-blur': 6, 'line-opacity': .6 } });
  map.addLayer({ id: 'hl', type: 'line', source: 'hl', layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': '#fff', 'line-width': 3 } });
  apply();
}

// ---------- Global / per-place scale ----------
// In "per place" mode, each run is weighted by its place's weight w (computed by
// build_data.py): the most frequent route in each place reaches the top of the scale.
const byZone = () => state.scale === 'zone';
const weight = base => byZone() ? ['*', base, ['get', 'w']] : base;
const scaled = a => byZone() ? ['min', 1, ['*', a, ['get', 'w']]] : a;
function lineOpacity() {
  const o = BASES[state.base].lineOpacity;
  return ['interpolate', ['linear'], ['zoom'], 8, scaled(o[0]), 14, scaled(o[1]), 18, scaled(o[2])];
}
function glowOpacity() {
  const o = BASES[state.base].glowOpacity;
  return ['interpolate', ['linear'], ['zoom'], 8, scaled(o[0]), 14, scaled(o[1])];
}

function apply() {
  if (!runs) return;
  const [dA, dB] = dateRange();
  const f = ['all', ['>=', ['get', 'd'], dA], ['<=', ['get', 'd'], dB],
    ['in', ['get', 'src'], ['literal', [...state.sources]]]];
  if (map.getLayer('lines')) {
    for (const id of ['glow', 'lines', 'heat', 'soft', 'plain', 'ex', 'ex-glow', 'ex-case']) map.setFilter(id, f);
    const vis = on => on ? 'visible' : 'none';
    map.setLayoutProperty('plain', 'visibility', vis(state.plain));
    map.setLayoutProperty('ex', 'visibility', vis(state.explore));
    map.setLayoutProperty('ex-glow', 'visibility', vis(state.explore));
    map.setLayoutProperty('ex-case', 'visibility', vis(state.explore));
    map.setLayoutProperty('heat', 'visibility', vis(state.heat));
    map.setLayoutProperty('soft', 'visibility', vis(state.soft));
    map.setLayoutProperty('lines', 'visibility', vis(state.lines));
    map.setLayoutProperty('glow', 'visibility', vis(state.lines));
    // When both are shown, thinner/subtler tracks so the heatmap stays readable
    const both = state.lines && (state.heat || state.soft);
    map.setPaintProperty('glow', 'line-opacity', both ? 0 : glowOpacity());
    map.setPaintProperty('lines', 'line-opacity', lineOpacity());
    map.setPaintProperty('heat', 'heatmap-weight', weight(.06));
    map.setPaintProperty('soft', 'heatmap-weight', weight(.008));
  }
  document.querySelectorAll('#scale button').forEach(x => x.classList.toggle('on', x.dataset.scale === state.scale));
  const sel = runs.filter(r => r.d >= dA && r.d <= dB && state.sources.has(r.src));
  document.getElementById('sRuns').textContent = sel.length.toLocaleString(LOCALE);
  document.getElementById('sKm').textContent = Math.round(sel.reduce((s, r) => s + r.km, 0)).toLocaleString(LOCALE);
  document.getElementById('yLabel').textContent = state.dFrom
    ? periodLabel(state.dFrom, state.dTo)
    : state.yMin === state.yMax ? state.yMin : `${state.yMin} – ${state.yMax}`;
  // active years = those covered by the range (years or brushing)
  const yA = Math.floor(dA / 10000), yB = Math.floor(dB / 10000);
  bars.querySelectorAll('div').forEach(d => d.classList.toggle('off', +d.dataset.y < yA || +d.dataset.y > yB));
  document.querySelectorAll('#barLabels span').forEach(s =>
    s.classList.toggle('on', +s.dataset.y >= yA && +s.dataset.y <= yB));
  // number of runs per place under the current filters
  const perZone = {};
  // a run counts in every place where it covered ≥ 1 km
  sel.forEach(r => (r.zs || [r.z]).forEach(z => perZone[z] = (perZone[z] || 0) + 1));
  document.querySelectorAll('#zones button').forEach(btn => {
    const n = perZone[btn.dataset.z] || 0;
    btn.querySelector('small').textContent = n;
    btn.classList.toggle('dim', n === 0);
  });
  document.querySelectorAll('#base button').forEach(x => x.classList.toggle('on', x.dataset.base === state.base));
  document.getElementById('showLines').checked = state.lines;
  document.getElementById('showHeat').checked = state.heat;
  document.getElementById('heatK').value = state.heatK;
  document.getElementById('heatVal').textContent = '×' + heatMult(state.heatK).toFixed(1);
  document.getElementById('showSoft').checked = state.soft;
  document.getElementById('lineW').value = state.lineW;
  document.getElementById('lineVal').textContent = '×' + lineMult(state.lineW).toFixed(1);
  document.getElementById('showPlain').checked = state.plain;
  document.getElementById('showExplore').checked = state.explore;
  document.getElementById('colLines').value = lineColor();
  document.getElementById('colPlain').value = plainColor();
  document.getElementById('colExplore').value = exploreColor();
  document.documentElement.style.setProperty('--explore', exploreColor());   // Exploration gauge
  document.getElementById('lineCtl').classList.toggle('off', !state.lines && !state.plain);
  document.getElementById('heatCtl').classList.toggle('off', !state.heat && !state.soft);
  document.getElementById('goal').value = state.goal;
  document.querySelectorAll('#zones button').forEach(b => b.classList.toggle('on', +b.dataset.z === state.zone));
  // Stats: same filters as the map, + the selected place
  const statSel = state.zone == null ? sel : sel.filter(r => (r.zs || []).includes(state.zone));
  window.renderStats?.(statSel);
}

// Active date range (YYYYMMDD): chart brushing, otherwise whole years
function dateRange() {
  return state.dFrom ? [state.dFrom, state.dTo] : [state.yMin * 10000 + 101, state.yMax * 10000 + 1231];
}
// "2022", "Mar 2022" or "3 Mar 2022 – 5 Jun 2023"
function periodLabel(a, b) {
  const y = Math.floor(a / 10000), m = Math.floor(a / 100) % 100;
  if (Math.floor(b / 10000) === y && a % 10000 === 101 && b % 10000 === 1231) return String(y);
  if (Math.floor(b / 100) === Math.floor(a / 100) && a % 100 === 1 && b % 100 === new Date(y, m, 0).getDate())
    return new Date(y, m - 1, 1).toLocaleDateString(LOCALE, { month: 'long', year: 'numeric' });
  return `${fmtD(a)} – ${fmtD(b)}`;
}
const fmtD = d => new Date(Math.floor(d / 10000), Math.floor(d / 100) % 100 - 1, d % 100)
  .toLocaleDateString(LOCALE, { day: 'numeric', month: 'short', year: 'numeric' });

// Highlights a run on the map and zooms to it
function highlightRun(r) {
  if (!map.getSource('hl')) return;
  map.getSource('hl').setData(r ? { type: 'Feature', properties: {},
    geometry: { type: 'MultiLineString', coordinates: r.segs } } : { type: 'FeatureCollection', features: [] });
  if (!r) return;
  const b = new maplibregl.LngLatBounds();
  r.segs.forEach(s => s.forEach(p => b.extend(p)));
  // padding = space actually taken by the panel and the stats drawer
  const W = map.getContainer().clientWidth, H = map.getContainer().clientHeight;
  const drawerH = statsOpen() ? document.getElementById('statsDrawer').offsetHeight + 32 : 40;
  const panelW = document.getElementById('panel').offsetWidth + 40;
  const pad = { top: 40, right: 40, bottom: Math.min(drawerH, H * .7), left: Math.min(panelW, W * .5) };
  map.fitBounds(b, { padding: pad, maxZoom: 15, duration: 1200 });
}
const statsOpen = () => !document.getElementById('statsDrawer').hidden;

let styleReady = false;
map.on('style.load', () => { styleReady = true; if (runs) addOverlay(); });

fetch('runs.json', { cache: 'no-cache' }).then(r => r.json()).then(data => {
  runs = data.runs;
  runs.forEach((r, i) => { r.year = +r.date.slice(0, 4); r.d = +r.date.replace(/-/g, ''); r.i = i; });
  const years = runs.map(r => r.year);
  const y0 = Math.min(...years), y1 = Math.max(...years);
  state.yMin = y0; state.yMax = y1;
  const srcs = [...new Set(runs.map(r => r.src))];
  srcs.forEach(s => state.sources.add(s));

  linesGeo = { type: 'FeatureCollection', features: runs.map(r => ({
    type: 'Feature', properties: { year: r.year, d: r.d, src: r.src, km: r.km, w: r.w || 1 },
    geometry: { type: 'MultiLineString', coordinates: r.segs } })) };
  // New paths: stretches run for the first time (computed by build_data.py)
  exploreGeo = { type: 'FeatureCollection', features: [] };
  for (const r of runs) for (const [si, a, b] of r.ex || [])
    exploreGeo.features.push({ type: 'Feature', properties: { year: r.year, d: r.d, src: r.src },
      geometry: { type: 'LineString', coordinates: r.segs[si].slice(a, b + 1) } });
  // Heatmap points: each point takes the weight of the place it lies in (pz)
  const zoneW = (data.zones || []).map(z => z.w);
  pointsGeo = { type: 'FeatureCollection', features: [] };
  for (const r of runs) r.segs.forEach((s, si) => s.forEach((c, pi) => {
    const zi = r.pz ? r.pz[si][pi] : r.z;
    pointsGeo.features.push({ type: 'Feature',
      properties: { year: r.year, d: r.d, src: r.src, w: zoneW[zi] ?? r.w ?? 1 },
      geometry: { type: 'Point', coordinates: c } });
  }));

  // Histogram by year
  const perYear = {}, kmYear = {};
  runs.forEach(r => {
    perYear[r.year] = (perYear[r.year] || 0) + 1;
    kmYear[r.year] = (kmYear[r.year] || 0) + r.km;
  });
  const maxY = Math.max(...Object.values(perYear));
  bars = document.getElementById('bars');
  const labels = document.getElementById('barLabels');
  const tip = document.getElementById('barTip');
  for (let y = y0; y <= y1; y++) {
    const d = document.createElement('div');
    const fill = document.createElement('span');
    fill.className = 'fill';
    fill.style.height = (100 * (perYear[y] || 0) / maxY) + '%';
    d.appendChild(fill);
    d.dataset.y = y;
    const lab = document.createElement('span');
    lab.textContent = String(y).slice(2);
    lab.dataset.y = y;
    labels.appendChild(lab);
    // Instant tooltip (the native title takes ~1 s to appear)
    d.onmouseenter = () => {
      tip.innerHTML = `<b>${y}</b> · ${perYear[y] || 0} runs · ${Math.round(kmYear[y] || 0).toLocaleString(LOCALE)} km`;
      tip.hidden = false;
      const wrap = bars.parentElement.getBoundingClientRect(), r = d.getBoundingClientRect();
      const half = tip.offsetWidth / 2;
      const x = Math.min(Math.max(r.left + r.width / 2 - wrap.left, half), wrap.width - half);
      tip.style.left = x + 'px';
      lab.classList.add('hover');
    };
    d.onmouseleave = () => { tip.hidden = true; lab.classList.remove('hover'); };
    // Click: this year only; click it again: all years
    // Shift + click: range between the last clicked year and this one
    d.onclick = e => {
      if (e.shiftKey && yearAnchor !== null) {
        state.yMin = Math.min(yearAnchor, y); state.yMax = Math.max(yearAnchor, y);
      } else {
        const only = state.yMin === y && state.yMax === y;
        state.yMin = only ? y0 : y; state.yMax = only ? y1 : y;
        yearAnchor = only ? null : y;
      }
      state.dFrom = state.dTo = null;
      yMin.value = state.yMin; yMax.value = state.yMax;
      apply();
    };
    d.onmousedown = e => { if (e.shiftKey) e.preventDefault(); };  // prevents text selection
    bars.appendChild(d);
  }
  const yMin = document.getElementById('yMin'), yMax = document.getElementById('yMax');
  for (const i of [yMin, yMax]) { i.min = y0; i.max = y1; i.step = 1; }
  yMin.value = y0; yMax.value = y1;
  yMin.oninput = yMax.oninput = () => {
    let a = +yMin.value, b = +yMax.value;
    if (a > b) [a, b] = [b, a];
    state.yMin = a; state.yMax = b; state.dFrom = state.dTo = null; apply();
  };

  const srcBox = document.getElementById('src');
  for (const s of srcs) {
    const l = document.createElement('label');
    l.innerHTML = `<input type="checkbox" checked> ${s[0].toUpperCase() + s.slice(1)}`;
    l.querySelector('input').onchange = e => {
      e.target.checked ? state.sources.add(s) : state.sources.delete(s); apply();
    };
    srcBox.appendChild(l);
  }

  // Place index: click = go there
  const zones = data.zones || [];
  window.ZONES = zones;   // shared with stats.js
  const zBox = document.getElementById('zones');
  document.getElementById('zCount').textContent = zones.length;
  zones.forEach((z, i) => {
    const btn = document.createElement('button');
    btn.dataset.z = i;
    const years = z.from.slice(0, 4) === z.to.slice(0, 4) ? z.from.slice(0, 4) : `${z.from.slice(0, 4)}–${z.to.slice(0, 4)}`;
    const km = Math.round(z.km).toLocaleString(LOCALE);
    btn.title = `${z.name}\n${z.n} runs through here · ${km} km inside · ${years}`;
    btn.innerHTML = `<span>${z.flag}</span><span class="zn"><span class="zname"></span><span class="zvia"></span></span><small></small>`;
    btn.querySelector('.zname').textContent = z.name;
    btn.querySelector('.zvia').textContent = `${km} km · ${years}`;
    btn.onclick = () => {
      if (state.zone === i) { state.zone = null; apply(); return; }
      state.zone = i; apply();
      map.fitBounds([[z.bbox[0], z.bbox[1]], [z.bbox[2], z.bbox[3]]], { padding: 60, maxZoom: 15, duration: 1800 });
    };
    zBox.appendChild(btn);
  });

  // Filter: ignores case, accents and hyphens ("st vallier" finds Saint-Vallier)
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/\bsaint\b/g, 'st').replace(/[-'’\s]+/g, ' ').trim();
  const zFilter = document.getElementById('zFilter');
  zFilter.oninput = () => {
    const q = norm(zFilter.value);
    let shown = 0;
    zBox.querySelectorAll('button').forEach(b => {
      const ok = !q || norm(zones[b.dataset.z].name).includes(q);
      b.hidden = !ok;
      if (ok) shown++;
    });
    document.getElementById('zEmpty').hidden = shown > 0;
    zBox.scrollTop = 0;
  };
  // Enter: goes to the first matching place
  zFilter.onkeydown = e => {
    if (e.key === 'Enter') zBox.querySelector('button:not([hidden])')?.click();
  };

  zone = mainZone(runs);
  map.fitBounds(zone, { padding: 60, duration: 0 });
  if (styleReady) addOverlay();
  apply();
});

// ---------- Controls ----------
document.querySelectorAll('#base button').forEach(b => b.onclick = () => {
  if (state.base === b.dataset.base) return;
  state.base = b.dataset.base; save(); apply();
  styleReady = false;
  map.setStyle(BASES[state.base].style, { diff: false });   // 'style.load' recreates the layers
});
document.getElementById('showLines').onchange = e => { state.lines = e.target.checked; save(); apply(); };
document.getElementById('showHeat').onchange = e => { state.heat = e.target.checked; save(); apply(); };
function applyColors() {
  if (map.getLayer('lines')) {
    map.setPaintProperty('lines', 'line-color', lineColor());
    map.setPaintProperty('glow', 'line-color', glowColor());
    map.setPaintProperty('plain', 'line-color', plainColor());
    map.setPaintProperty('ex', 'line-color', exploreColor());
    map.setPaintProperty('ex-glow', 'line-color', exploreColor());
  }
  save(); apply();
}
document.getElementById('colLines').oninput = e => { state.colLines = e.target.value; applyColors(); };
document.getElementById('colPlain').oninput = e => { state.colPlain = e.target.value; applyColors(); };
document.getElementById('colExplore').oninput = e => { state.colExplore = e.target.value; applyColors(); };
document.getElementById('colReset').onclick = () => { state.colLines = state.colPlain = state.colExplore = null; applyColors(); };
document.getElementById('showPlain').onchange = e => { state.plain = e.target.checked; save(); apply(); };
document.getElementById('showExplore').onchange = e => { state.explore = e.target.checked; save(); apply(); };
document.getElementById('showSoft').onchange = e => { state.soft = e.target.checked; save(); apply(); };
document.querySelectorAll('#scale button').forEach(b => b.onclick = () => {
  state.scale = b.dataset.scale; save(); apply();
});
document.getElementById('lineW').oninput = e => {
  state.lineW = +e.target.value;
  if (map.getLayer('lines')) {
    map.setPaintProperty('lines', 'line-width', lineWidth());
    map.setPaintProperty('plain', 'line-width', lineWidth());
    map.setPaintProperty('glow', 'line-width', glowWidth());
  }
  apply(); save();
};
document.getElementById('heatK').oninput = e => {
  state.heatK = +e.target.value;
  if (map.getLayer('heat')) {
    map.setPaintProperty('heat', 'heatmap-intensity', heatIntensity());
    map.setPaintProperty('soft', 'heatmap-intensity', softIntensity());
  }
  apply(); save();
};
document.getElementById('fitMain').onclick = () => zone && map.fitBounds(zone, { padding: 60 });
// ---------- Settings popup ----------
const settings = document.getElementById('settings');
const openBtn = document.getElementById('openSettings');
const setSettings = open => {
  settings.hidden = !open;
  openBtn.classList.toggle('on', open);
  openBtn.setAttribute('aria-expanded', open);
};
openBtn.onclick = () => setSettings(settings.hidden);
document.getElementById('closeSettings').onclick = () => setSettings(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !settings.hidden) setSettings(false); });

document.getElementById('toggle').onclick =() => document.getElementById('panel').classList.toggle('collapsed');
</script>
<script src="stats.js"></script>
</body>
</html>
