<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>My runs</title>
    <meta
      name="description"
      content="Every run you've ever done on one map: routes, heatmaps, new paths and stats. Import your GPX, FIT, Strava or Nike files — they never leave your browser."
    />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Link previews (Open Graph, X/Twitter). With SITE_URL set at build time (see vite.config.js),
     the image URL becomes absolute and og:url is added. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="runheat" />
    <meta property="og:title" content="runheat — every run on one map" />
    <meta
      property="og:description"
      content="Routes, heatmaps, new paths and stats from your GPX, FIT, Strava or Nike files. Everything stays in your browser."
    />
    <meta property="og:image" content="og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="runheat: a dark map of the French Riviera with glowing orange running routes, next to the side panel"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="runheat — every run on one map" />
    <meta
      name="twitter:description"
      content="Routes, heatmaps, new paths and stats from your GPX, FIT, Strava or Nike files. Everything stays in your browser."
    />
    <meta name="twitter:image" content="og-image.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
